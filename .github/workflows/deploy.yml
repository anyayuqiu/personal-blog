name: Deploy blog to cloud server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-blog-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build static site and search index
        run: pnpm build
      - name: Check build output
        run: test -s dist/index.html && test -d dist/pagefind
      - name: Configure deployment SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.BLOG_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.BLOG_DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/blog_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/blog_deploy" "$HOME/.ssh/known_hosts"
      - name: Publish the built site
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          tar -czf - -C dist . | ssh -i "$HOME/.ssh/blog_deploy" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            blog-deploy@47.108.48.165 "deploy $DEPLOY_COMMIT"
      - name: Check public deployment
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          ssh -i "$HOME/.ssh/blog_deploy" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            blog-deploy@47.108.48.165 "verify $DEPLOY_COMMIT"
      - name: Remove temporary private key
        if: always()
        run: rm -f "$HOME/.ssh/blog_deploy"
